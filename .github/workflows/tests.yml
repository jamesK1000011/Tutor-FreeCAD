# SPDX-License-Identifier: LGPL-2.1-or-later
# The headless test suite (plain Python: no FreeCAD, no Agent Link checkout;
# those tests skip themselves). One job, one Python, pip cached.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install
        run: python -m pip install -r tests/requirements.txt
      - name: Headless tests
        run: python -m pytest -q tests
